# Second Brain — ALLES IN EINEM CONTAINER (App + qmd-Suche)
# Start:  docker compose up -d          (zieht das fertige Image, kein Build nötig)
# Web-UI: http://<UNRAID-IP>:8686
#
# Das Image wird automatisch per GitHub Actions gebaut und liegt öffentlich in der
# GitHub Container Registry. Auf dem NAS brauchst du daher NUR diese Datei + eine .env.
# Nur EINE Pflichtangabe: der Pfad zu deinen Notizen (SECOND_BRAIN_DATA) in .env.
# qmd (Bedeutungssuche) läuft mit im Container — kein zweiter Dienst nötig.
services:
  second-brain:
    image: ghcr.io/robirr/secondbrain:latest
    pull_policy: always          # bei jedem up die neueste Version ziehen
    container_name: second-brain
    ports:
      - "8686:80"          # Host-Port 8686 (frei wählbar) -> Container-Port 80
      # Push-Kanal: hier legen Agenten (z.B. Hermes) neue Notizen in 00-Inbox/hermes ab.
      # Nur aktiv, wenn CAPTURE_TOKEN gesetzt ist (siehe unten).
      - "8765:8765"
    environment:
      - TZ=Europe/Zurich
      # Nur zur ANZEIGE in der Ansicht "Verbindungen": der Pfad des Vaults auf dem NAS.
      # Im Container heisst er /usr/share/nginx/html/data, das hilft dir dort nicht weiter.
      - VAULT_HOST_PATH=${SECOND_BRAIN_DATA:-./data}
      # Ableiten beim Start abschalten (dann bleiben INDEX.md/graph.json/integrations.json
      # so, wie sie sind):  BRAIN_BUILD_INDEX=0
      - BRAIN_BUILD_INDEX=${BRAIN_BUILD_INDEX:-1}
      # Push-Kanal (POST :8765/capture, Kopfzeile X-Capture-Token). OHNE Token startet er nicht —
      # das ist Absicht: ein offener Endpunkt liesse jeden im Netz in den Vault schreiben.
      # Den Wert in die .env NEBEN dieser Datei schreiben, nicht hierher:  CAPTURE_TOKEN=...
      - CAPTURE_TOKEN=${CAPTURE_TOKEN:-}
      - CAPTURE_PORT=${CAPTURE_PORT:-8765}
    volumes:
      # (1) Deine Notizen (Vault-WURZEL: graph.json + .md).
      #     BESCHREIBBAR (:rw), weil der Container beim Start den Katalog neu ableitet —
      #     er schreibt genau drei Dateien in die Wurzel: INDEX.md, graph.json,
      #     integrations.json. Deine .md-Notizen werden nur gelesen, nie angefasst.
      #     Lieber unantastbar? Dann :ro setzen — der Start meldet das und laesst alles wie es ist
      #     (die App zeigt dann den Stand vom letzten Indexlauf auf deinem Rechner).
      - ${SECOND_BRAIN_DATA:-./data}:/usr/share/nginx/html/data:rw
      # (2) qmd-Zuhause: lokale Modelle + Suchindex. Bleibt über Neustarts erhalten,
      #     damit die ~2-3 GB Modelle nicht jedes Mal neu geladen werden.
      - qmd-home:/qmd-home
    restart: unless-stopped
    labels:
      # Unraid: WebUI-Link + Icon in der Docker-Übersicht
      - "net.unraid.docker.webui=http://[IP]:[PORT:8686]/"
      - "net.unraid.docker.icon=https://raw.githubusercontent.com/robirr/secondbrain/main/public/favicon.svg"

volumes:
  qmd-home:

# --- Selbst bauen statt ziehen? (nur nötig, wenn du den Code lokal geändert hast) ---
# Das ganze Repo muss dann vorliegen. Entweder:
#   docker build -t ghcr.io/robirr/secondbrain:latest .   &&   docker compose up -d
# oder in der Datei oben "image:" durch "build: ." ersetzen und  docker compose up -d --build.
